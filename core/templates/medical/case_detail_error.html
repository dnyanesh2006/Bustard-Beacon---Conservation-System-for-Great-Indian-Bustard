{% extends 'base.html' %}

{% block title %}Case Unavailable{% endblock %}

{% block content %}
<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-6 text-center">
      <div class="bb-card p-5">
        <i class="bi bi-exclamation-triangle-fill text-warning" style="font-size: 4rem;"></i>
        <h3 class="brand-font mt-3" style="color: var(--text-primary);">Record Unavailable</h3>
        <p class="text-muted mt-2">{{ message }}</p>
        <a href="javascript:history.back()" class="btn btn-outline-secondary mt-3"><i class="bi bi-arrow-left"></i> Go Back</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
