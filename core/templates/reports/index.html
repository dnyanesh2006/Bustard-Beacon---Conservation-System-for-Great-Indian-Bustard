{% extends 'base.html' %}

{% block title %}Report Generation Hub — BUSTARD BEACON{% endblock %}

{% block content %}
<div class="container my-5" style="max-width: 700px;">
  <div class="bb-card p-5 text-center">
    <i class="bi bi-file-earmark-pdf text-warning display-4 mb-3 d-block"></i>
    <h3 class="brand-font mb-2" style="color: var(--text-primary);">Report Generation Hub</h3>
    <p class="text-muted mb-4">
      Your authenticated account has role: <b>{{ role|default:"Staff" }}</b>.
    </p>
    <a href="{% url 'dashboard' %}" class="btn btn-bb-sand fw-bold px-4">
      <i class="bi bi-speedometer2 me-1"></i> Go to My Role Dashboard
    </a>
  </div>
</div>
{% endblock %}
