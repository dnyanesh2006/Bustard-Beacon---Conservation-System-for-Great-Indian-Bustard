{% extends 'base.html' %}
{% block title %}Password Reset Complete — Bustard Beacon{% endblock %}
{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="bb-card p-4 text-center">
                <i class="bi bi-check-circle-fill text-success display-2 mb-3"></i>
                <h3 class="brand-font mb-3" style="color: var(--text-primary);">Password Configuration Complete</h3>
                <p style="color: var(--text-secondary);">Your account password has been updated and secured successfully. You can now log in to the platform.</p>
                <div class="mt-4">
                    <a href="{% url 'login' %}" class="btn btn-bb-sand px-4 py-2 fw-bold shadow-sm">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Proceed to Staff Login
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
