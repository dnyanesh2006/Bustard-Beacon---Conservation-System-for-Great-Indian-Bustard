{% extends 'base.html' %}
{% block title %}Password Reset Complete - Bustard Beacon{% endblock %}
{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="bb-card p-4 text-center">
                <i class="bi bi-check-circle-fill text-success display-1 mb-3"></i>
                <h3 class="brand-font mb-4">Password Reset Complete</h3>
                <p>Your password has been set. You may go ahead and log in now.</p>
                <a href="{% url 'login' %}" class="btn btn-warning mt-3 w-100 fw-bold">Log in</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
